<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم المطورة 🐾</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .sec-group { background-color: #fff3cd; padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        input, select { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .prod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .del-btn { background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة الإدارة (إضافة وحذف) 🐾</h2>

    <div class="sec-group">
        <input type="text" id="ghUser" placeholder="اسم حسابك">
        <input type="text" id="ghRepo" placeholder="اسم المستودع">
        <input type="password" id="ghToken" placeholder="التوكن (GitHub Token)">
        <button onclick="loadProducts()">جلب قائمة المنتجات</button>
    </div>

    <hr>
    <h3>إضافة منتج جديد:</h3>
    <input type="text" id="prodName" placeholder="اسم المنتج">
    <input type="text" id="prodPrice" placeholder="السعر">
    <input type="text" id="prodImage" placeholder="رابط الصورة">
    <button onclick="submitProduct()">حفظ المنتج</button>

    <hr>
    <h3>قائمة المنتجات الحالية:</h3>
    <div id="productsList"></div>
</div>

<script>
function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }

async function getAuth() {
    return {
        user: document.getElementById('ghUser').value.trim(),
        repo: document.getElementById('ghRepo').value.trim(),
        token: document.getElementById('ghToken').value.trim()
    };
}

async function loadProducts() {
    const {user, repo, token} = await getAuth();
    if (!user || !repo || !token) return alert("اكتب البيانات والتوكن أولاً!");
    
    const url = `https://api.github.com/repos/${user}/${repo}/contents/products.json`;
    const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
    const data = await res.json();
    const products = JSON.parse(b64_to_utf8(data.content));
    
    const listDiv = document.getElementById('productsList');
    listDiv.innerHTML = '';
    products.forEach(p => {
        listDiv.innerHTML += `
            <div class="prod-item">
                <span>${p.name}</span>
                <button class="del-btn" onclick="deleteProduct(${p.id})">حذف</button>
            </div>`;
    });
}

async function deleteProduct(id) {
    if (!confirm("متأكد عايز تحذف المنتج ده؟")) return;
    const {user, repo, token} = await getAuth();
    const url = `https://api.github.com/repos/${user}/${repo}/contents/products.json`;
    
    // 1. Get current file
    const res = await fetch(url, { headers: { "Authorization": `token ${token}` } });
    const data = await res.json();
    let products = JSON.parse(b64_to_utf8(data.content));
    
    // 2. Remove product
    products = products.filter(p => p.id !== id);
    
    // 3. Update file
    await fetch(url, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            message: `Delete product ID: ${id}`,
            content: utf8_to_b64(JSON.stringify(products, null, 2)),
            sha: data.sha
        })
    });
    alert("تم الحذف!");
    loadProducts(); // تحديث القائمة
}

async function submitProduct() {
    const {user, repo, token} = await getAuth();
    const name = document.getElementById('prodName').value;
    const price = document.getElementById('prodPrice').value;
    const image = document.getElementById('prodImage').value;

    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
    const data = await res.json();
    let products = JSON.parse(b64_to_utf8(data.content));
    
    products.push({ id: Date.now(), name, price, image });
    
    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            message: "Add product",
            content: utf8_to_b64(JSON.stringify(products, null, 2)),
            sha: data.sha
        })
    });
    alert("تمت الإضافة!");
    loadProducts();
}
</script>
</body>
</html>

    <div class="form-group">
        <label>المساحة / السعة:</label>
        <input type="text" id="prodStorage">
    </div>

    <div class="form-group">
        <label>كود المنتج:</label>
        <input type="text" id="prodCode">
    </div>

    <div class="form-group">
        <label>السعر:</label>
        <input type="text" id="prodPrice">
    </div>

    <div class="form-group">
        <label>رابط صورة المنتج:</label>
        <input type="text" id="prodImage">
    </div>

    <button onclick="submitProduct()">حفظ وإضافة المنتج للموقع فوراً</button>
</div>

<script>
function utf8_to_b64(str) {
    return btoa(unescape(encodeURIComponent(str)));
}

function b64_to_utf8(str) {
    return decodeURIComponent(escape(atob(str)));
}

function submitProduct() {
    const user = document.getElementById('ghUser').value.trim();
    const repo = document.getElementById('ghRepo').value.trim();
    const token = document.getElementById('ghToken').value.trim();
    
    const name = document.getElementById('prodName').value.trim();
    const category = document.getElementById('prodCategory').value;
    const size = document.getElementById('prodSize').value.trim();
    const storage = document.getElementById('prodStorage').value.trim();
    const code = document.getElementById('prodCode').value.trim();
    const price = document.getElementById('prodPrice').value.trim();
    const image = document.getElementById('prodImage').value.trim();

    if (!user || !repo || !token || !name || !price || !image) {
        alert("برجاء ملء البيانات الأساسية ومفتاح الأمان أولاً!");
        return;
    }

    const url = `https://api.github.com/repos/${user}/${repo}/contents/products.json`;

    fetch(url, {
        headers: {
            "Authorization": `token ${token}`
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to fetch products.json");
        }
        return response.json();
    })
    .then(fileData => {
        const sha = fileData.sha;
        const currentContent = b64_to_utf8(fileData.content);
        let productsList = [];
        
        try {
            productsList = JSON.parse(currentContent);
        } catch (e) {
            productsList = [];
        }

        const newId = productsList.length > 0 ? Math.max(...productsList.map(p => p.id)) + 1 : 1;

        const newProduct = {
            id: newId,
            name: name,
            category: category,
            size: size,
            storage: storage,
            code: code,
            price: price,
            image: image
        };

        productsList.push(newProduct);

        const updatedContentBase64 = utf8_to_b64(JSON.stringify(productsList, null, 2));

        const bodyData = {
            message: `Add product: ${name}`,
            content: updatedContentBase64,
            sha: sha
        };

        return fetch(url, {
            method: "PUT",
            headers: {
                "Authorization": `token ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(bodyData)
        });
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Failed to update");
        }
        return response.json();
    })
    .then(data => {
        alert("تم إضافة المنتج بنجاح وتحديث الموقع!");
        document.getElementById('prodName').value = '';
        document.getElementById('prodSize').value = '';
        document.getElementById('prodStorage').value = '';
        document.getElementById('prodCode').value = '';
        document.getElementById('prodPrice').value = '';
        document.getElementById('prodImage').value = '';
    })
    .catch(error => {
        console.error(error);
        alert("حدث خطأ! تأكد من صحة اسم الحساب، المستودع، ومفتاح الأمان.");
    });
}
</script>
</body>
</html>
