<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الإدارة</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 600px; background: white; padding: 25px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 3px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 60px; resize: vertical; }
        .dynamic-item { border: 1px dashed #aaa; padding: 10px; margin-bottom: 10px; border-radius: 4px; background: #fafafa; position: relative; }
        .add-btn { background: #28a745; color: white; padding: 8px 15px; border: none; border-radius: 4px; cursor: pointer; margin-bottom: 15px; font-weight: bold; }
        .del-btn { background: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; margin-top: 5px; }
        button.save-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        .category-block { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 6px; }
        .category-title { font-weight: bold; color: #495057; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #dee2e6; padding-bottom: 5px; }
        .prod-item { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-edit { background: #ffc107; color: black; flex: 1; font-weight: bold; }
        .btn-del { background: #dc3545; color: white; flex: 1; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم الإدارة</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showSection('add', event)">إضافة منتج</button>
        <button class="tab-btn" onclick="showSection('manage', event)">إدارة المنتجات</button>
    </div>

    <div style="background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <div class="form-group"><input type="text" id="ghUser" placeholder="اسم المستخدم على GitHub"></div>
        <div class="form-group"><input type="text" id="ghRepo" placeholder="اسم المستودع"></div>
        <div class="form-group"><input type="password" id="ghToken" placeholder="رمز الأمان (Token)"></div>
    </div>

    <div id="addSection" class="section active">
        <div class="form-group">
            <label>القسم:</label>
            <select id="addCategory">
                <option value="cats">قطط (A)</option>
                <option value="dogs">كلاب (B)</option>
                <option value="chick">كتاكيت (C)</option>
                <option value="vaccine">تطعيمات (D)</option>
            </select>
        </div>
        <div class="form-group"><label>اسم المنتج:</label><input type="text" id="addName"></div>
        <div class="form-group"><label>الحجم:</label><input type="text" id="addSize"></div>
        <div class="form-group"><label>السعة / التخزين:</label><input type="text" id="addStorage"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="addPrice"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="addImage"></div>
        
        <label>تفاصيل وميزات إضافية:</label>
        <div id="addDetailsContainer"></div>
        <button class="add-btn" onclick="addDetailField('addDetailsContainer')">+ إضافة ميزة</button>
        
        <button class="save-btn" onclick="addProduct()">حفظ المنتج الجديد</button>
    </div>

    <div id="manageSection" class="section">
        <button onclick="loadProducts()" style="background:#28a745; margin-bottom: 15px;">تحميل وقراءة المنتجات</button>
        <div id="productsList"></div>
    </div>
</div>

<script>
function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }

function showSection(s, e) {
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(s + 'Section').classList.add('active');
    e.target.classList.add('active');
}

function getAuth() { 
    return { 
        user: document.getElementById('ghUser').value.trim(), 
        repo: document.getElementById('ghRepo').value.trim(), 
        token: document.getElementById('ghToken').value.trim() 
    }; 
}

function addDetailField(containerId, title = '', content = '') {
    const container = document.getElementById(containerId);
    const div = document.createElement('div');
    div.className = 'dynamic-item';
    div.innerHTML = `
        <input type="text" placeholder="العنوان (مثال: بلد المنشأ)" class="detail-title" value="${title}" style="margin-bottom:5px; font-weight:bold;">
        <textarea placeholder="التفاصيل" class="detail-content">${content}</textarea>
        <button class="del-btn" onclick="this.parentElement.remove()">إزالة الميزة ❌</button>
    `;
    container.appendChild(div);
}

function collectDetails(containerId) {
    const container = document.getElementById(containerId);
    const details = [];
    container.querySelectorAll('.dynamic-item').forEach(item => {
        const t = item.querySelector('.detail-title').value.trim();
        const c = item.querySelector('.detail-content').value.trim();
        if (t || c) {
            details.push({ title: t, content: c });
        }
    });
    return details;
}

async function loadProducts() {
    const {user, repo, token} = getAuth();
    if (!user || !repo || !token) return alert("يرجى إدخال بيانات GitHub أولاً!");
    
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        if(!res.ok) throw new Error();
        const data = await res.json();
        const products = JSON.parse(b64_to_utf8(data.content));
        const list = document.getElementById('productsList');
        list.innerHTML = '';
        
        if(products.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999;">لا توجد منتجات حالية.</p>';
            return;
        }
        
        const categories = { cats: [], dogs: [], chick: [], vaccine: [] };
        const catNames = { cats: 'قطط (A)', dogs: 'كلاب (B)', chick: 'كتاكيت (C)', vaccine: 'تطعيمات (D)' };

        products.forEach(p => {
            const cat = p.category || 'cats';
            if (categories[cat]) { categories[cat].push(p); } else { categories['cats'].push(p); }
        });

        for (const key in categories) {
            if (categories[key].length === 0) continue;
            
            let blockHtml = `<div class="category-block"><div class="category-title">${catNames[key]}</div>`;
            categories[key].forEach(p => {
                blockHtml += `
                    <div class="prod-item" id="p-${p.id}">
                        <div class="form-group"><label>كود المنتج:</label><input type="text" value="${p.code || ''}" disabled style="background:#e9ecef; font-weight:bold;"></div>
                        <div class="form-group"><label>الاسم:</label><input type="text" id="n-${p.id}" value="${p.name || ''}"></div>
                        <div class="form-group"><label>السعر:</label><input type="text" id="pr-${p.id}" value="${p.price || ''}"></div>
                        <div class="form-group"><label>الحجم:</label><input type="text" id="sz-${p.id}" value="${p.size || ''}"></div>
                        <div class="form-group"><label>السعة:</label><input type="text" id="st-${p.id}" value="${p.storage || ''}"></div>
                        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="img-${p.id}" value="${p.image || ''}"></div>
                        
                        <label>الميزات والخصائص:</label>
                        <div id="edit-details-${p.id}"></div>
                        <button class="add-btn" onclick="addDetailField('edit-details-${p.id}')" style="margin-top:5px; font-size:12px; padding:5px 10px;">+ إضافة ميزة للمنتج</button>
                        
                        <div class="actions">
                            <button class="btn-edit" onclick="saveEdit(${p.id})">حفظ التعديلات</button>
                            <button class="btn-del" onclick="deleteProduct(${p.id})">حذف ❌</button>
                        </div>
                    </div>`;
            });
            blockHtml += `</div>`;
            list.innerHTML += blockHtml;
            
            categories[key].forEach(p => {
                if(p.features) {
                    p.features.forEach(f => addDetailField(`edit-details-${p.id}`, f.title, f.content));
                }
            });
        }
    } catch(err) {
        alert("فشل تحميل قائمة المنتجات. تأكد من صحة البيانات والتوكن!");
    }
}

async function saveEdit(id) {
    const {user, repo, token} = getAuth();
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content));
        
        const prod = products.find(p => p.id === id);
        if(prod) {
            prod.name = document.getElementById(`n-${id}`).value.trim();
            prod.price = document.getElementById(`pr-${id}`).value.trim();
            prod.size = document.getElementById(`sz-${id}`).value.trim();
            prod.storage = document.getElementById(`st-${id}`).value.trim();
            prod.image = document.getElementById(`img-${id}`).value.trim();
            prod.features = collectDetails(`edit-details-${id}`);
        }
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Update product features", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert("تم حفظ جميع التعديلات بنجاح!");
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء تحديث بيانات المنتج!");
    }
}

async function deleteProduct(id) {
    if (!confirm("هل أنت متأكد من حذف هذا المنتج نهائياً؟")) return;
    const {user, repo, token} = getAuth();
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content)).filter(p => p.id !== id);
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Delete product from list", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert("تم حذف المنتج!");
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء حذف المنتج!");
    }
}

async function addProduct() {
    const {user, repo, token} = getAuth();
    const name = document.getElementById('addName').value.trim();
    const category = document.getElementById('addCategory').value;
    const size = document.getElementById('addSize').value.trim();
    const storage = document.getElementById('addStorage').value.trim();
    const price = document.getElementById('addPrice').value.trim();
    const image = document.getElementById('addImage').value.trim();

    if (!user || !repo || !token || !name || !price || !image) {
        return alert("يرجى ملء كافة الخانات الأساسية المطلوبة!");
    }

    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content));
        
        const categoryCounts = { cats: 0, dogs: 0, chick: 0, vaccine: 0 };
        products.forEach(p => {
            const cat = p.category || 'cats';
            if (categoryCounts[cat] !== undefined) categoryCounts[cat]++;
        });
        
        const prefixes = { cats: 'A', dogs: 'B', chick: 'C', vaccine: 'D' };
        const nextNumber = (categoryCounts[category] || 0) + 1;
        const generatedCode = prefixes[category] + nextNumber;

        const newId = Date.now();
        const features = collectDetails('addDetailsContainer');

        products.push({ id: newId, code: generatedCode, category, name, size, storage, price, image, features });
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Add new product dynamically", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert(`تم الحفظ بنجاح! كود المنتج الجديد: ${generatedCode}`);
        
        document.getElementById('addName').value = '';
        document.getElementById('addSize').value = '';
        document.getElementById('addStorage').value = '';
        document.getElementById('addPrice').value = '';
        document.getElementById('addImage').value = '';
        document.getElementById('addDetailsContainer').innerHTML = '';
    } catch(err) {
        alert("حدث خطأ أثناء الاتصال وحفظ المنتج!");
    }
}
</script>
</body>
                    </html>
