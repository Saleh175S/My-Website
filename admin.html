<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الإدارة الكاملة</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 550px; background: white; padding: 25px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 3px; font-weight: bold; color: #555; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 80px; resize: vertical; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .category-block { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 6px; }
        .category-title { font-weight: bold; color: #495057; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #dee2e6; padding-bottom: 5px; }
        .prod-item { background: #fff; padding: 15px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-edit { background: #ffc107; color: black; flex: 1; }
        .btn-del { background: #dc3545; color: white; flex: 1; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم الإدارة</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showSection('add', event)">إضافة منتج</button>
        <button class="tab-btn" onclick="showSection('manage', event)">إدارة المنتجات</button>
    </div>

    <div style="background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
        <input type="text" id="ghUser" placeholder="اسم المستخدم على GitHub" style="margin-bottom:5px;">
        <input type="text" id="ghRepo" placeholder="اسم المستودع" style="margin-bottom:5px;">
        <input type="password" id="ghToken" placeholder="توكن GitHub">
    </div>

    <div id="addSection" class="section active">
        <div class="form-group"><label>القسم:</label>
            <select id="addCategory">
                <option value="cats">قطط (A)</option>
                <option value="dogs">كلاب (B)</option>
                <option value="chick">كتاكيت (C)</option>
                <option value="vaccine">تطعيمات (D)</option>
            </select>
        </div>
        <div class="form-group"><label>اسم المنتج:</label><input type="text" id="addName"></div>
        <div class="form-group"><label>الحجم:</label><input type="text" id="addSize"></div>
        <div class="form-group"><label>السعة / التخزين:</label><input type="text" id="addStorage"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="addPrice"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="addImage"></div>
        <div class="form-group"><label>تفاصيل إضافية:</label><textarea id="addDetails" placeholder="اكتب أي ملاحظات هنا..."></textarea></div>
        <button onclick="addProduct()">حفظ المنتج الجديد</button>
    </div>

    <div id="manageSection" class="section">
        <button onclick="loadProducts()" style="background:#28a745; margin-bottom: 15px;">تحميل القائمة</button>
        <div id="productsList"></div>
    </div>
</div>

<script>
function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }
function showSection(s, e) {
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(s + 'Section').classList.add('active');
    e.target.classList.add('active');
}
function getAuth() { return { user: document.getElementById('ghUser').value.trim(), repo: document.getElementById('ghRepo').value.trim(), token: document.getElementById('ghToken').value.trim() }; }

async function loadProducts() {
    const {user, repo, token} = getAuth();
    if (!user || !repo || !token) return alert("يرجى إدخال بيانات GitHub!");
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        const products = JSON.parse(b64_to_utf8(data.content));
        const list = document.getElementById('productsList');
        list.innerHTML = '';
        const categories = { cats: [], dogs: [], chick: [], vaccine: [] };
        const catNames = { cats: 'قطط (A)', dogs: 'كلاب (B)', chick: 'كتاكيت (C)', vaccine: 'تطعيمات (D)' };
        products.forEach(p => { if(categories[p.category]) categories[p.category].push(p); else categories['cats'].push(p); });

        for (const key in categories) {
            if (categories[key].length === 0) continue;
            let blockHtml = `<div class="category-block"><div class="category-title">${catNames[key]}</div>`;
            categories[key].forEach(p => {
                blockHtml += `
                    <div class="prod-item">
                        <div class="form-group"><label>كود:</label><input type="text" value="${p.code || ''}" disabled></div>
                        <div class="form-group"><label>الاسم:</label><input type="text" id="n-${p.id}" value="${p.name || ''}"></div>
                        <div class="form-group"><label>السعر:</label><input type="text" id="pr-${p.id}" value="${p.price || ''}"></div>
                        <div class="form-group"><label>الحجم:</label><input type="text" id="sz-${p.id}" value="${p.size || ''}"></div>
                        <div class="form-group"><label>السعة:</label><input type="text" id="st-${p.id}" value="${p.storage || ''}"></div>
                        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="img-${p.id}" value="${p.image || ''}"></div>
                        <div class="form-group"><label>التفاصيل:</label><textarea id="dt-${p.id}">${p.details || ''}</textarea></div>
                        <div class="actions">
                            <button class="btn-edit" onclick="saveEdit(${p.id})">حفظ التعديلات</button>
                            <button class="btn-del" onclick="deleteProduct(${p.id})">حذف</button>
                        </div>
                    </div>`;
            });
            list.innerHTML += blockHtml + `</div>`;
        }
    } catch(err) { alert("خطأ في التحميل!"); }
}

async function saveEdit(id) {
    const {user, repo, token} = getAuth();
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content));
        const prod = products.find(p => p.id === id);
        if(prod) {
            prod.name = document.getElementById(`n-${id}`).value;
            prod.price = document.getElementById(`pr-${id}`).value;
            prod.size = document.getElementById(`sz-${id}`).value;
            prod.storage = document.getElementById(`st-${id}`).value;
            prod.image = document.getElementById(`img-${id}`).value;
            prod.details = document.getElementById(`dt-${id}`).value;
        }
        await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Update product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        alert("تم الحفظ!");
        loadProducts();
    } catch(err) { alert("خطأ في الحفظ!"); }
}

async function deleteProduct(id) {
    if (!confirm("هل أنت متأكد؟")) return;
    const {user, repo, token} = getAuth();
    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
    const data = await res.json();
    let products = JSON.parse(b64_to_utf8(data.content)).filter(p => p.id !== id);
    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Delete product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
    });
    loadProducts();
}

async function addProduct() {
    const {user, repo, token} = getAuth();
    const category = document.getElementById('addCategory').value;
    const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
    const data = await res.json();
    let products = JSON.parse(b64_to_utf8(data.content));
    
    const count = products.filter(p => p.category === category).length;
    const prefixes = { cats: 'A', dogs: 'B', chick: 'C', vaccine: 'D' };
    const code = prefixes[category] + (count + 1);

    products.push({
        id: Date.now(), // استخدمنا التوقيت كـ ID فريد
        code: code,
        category: category,
        name: document.getElementById('addName').value,
        price: document.getElementById('addPrice').value,
        size: document.getElementById('addSize').value,
        storage: document.getElementById('addStorage').value,
        image: document.getElementById('addImage').value,
        details: document.getElementById('addDetails').value
    });

    await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: "Add product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
    });
    alert("تمت الإضافة!");
}
</script>
</body>
        </html>
