<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الإدارة</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 500px; background: white; padding: 25px; margin: 0 auto; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h4 { text-align: center; color: #333; margin-bottom: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: #ddd; font-weight: bold; }
        .tab-btn.active { background: #007bff; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        .sec-group { background: #fff3cd; padding: 15px; border: 1px solid #ffeeba; border-radius: 6px; margin-bottom: 20px; }
        .category-block { margin-top: 20px; padding: 10px; background: #e9ecef; border-radius: 6px; }
        .category-title { font-weight: bold; color: #495057; margin-bottom: 10px; text-transform: uppercase; border-bottom: 2px solid #dee2e6; padding-bottom: 5px; }
        .prod-item { background: #f9f9f9; padding: 15px; border: 1px solid #eee; border-radius: 6px; margin-bottom: 10px; }
        .actions { display: flex; gap: 10px; margin-top: 10px; }
        .btn-edit { background: #ffc107; color: black; }
        .btn-del { background: #dc3545; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم الإدارة</h2>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showSection('add', event)">إضافة منتج</button>
        <button class="tab-btn" onclick="showSection('manage', event)">إدارة المنتجات</button>
    </div>

    <div class="sec-group">
        <div class="form-group">
            <label>اسم المستخدم على GitHub:</label>
            <input type="text" id="ghUser" placeholder="اسم حسابك">
        </div>
        <div class="form-group">
            <label>اسم المستودع:</label>
            <input type="text" id="ghRepo" placeholder="اسم المستودع">
        </div>
        <div class="form-group">
            <label>رمز الأمان (Token):</label>
            <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
        </div>
    </div>

    <!-- قسم الإضافة -->
    <div id="addSection" class="section active">
        <div class="form-group"><label>اسم المنتج:</label><input type="text" id="addName"></div>
        <div class="form-group">
            <label>القسم:</label>
            <select id="addCategory">
                <option value="cats">قطط</option>
                <option value="dogs">كلاب</option>
                <option value="chick">كتاكيت</option>
                <option value="vaccine">تطعيمات</option>
            </select>
        </div>
        <div class="form-group"><label>الحجم:</label><input type="text" id="addSize"></div>
        <div class="form-group"><label>المساحة / السعة:</label><input type="text" id="addStorage"></div>
        <div class="form-group"><label>كود المنتج:</label><input type="text" id="addCode"></div>
        <div class="form-group"><label>السعر:</label><input type="text" id="addPrice"></div>
        <div class="form-group"><label>رابط الصورة:</label><input type="text" id="addImage"></div>
        <button onclick="addProduct()">حفظ المنتج</button>
    </div>

    <!-- قسم الإدارة -->
    <div id="manageSection" class="section">
        <button onclick="loadProducts()" style="background:#28a745; margin-bottom: 15px;">تحميل قائمة المنتجات</button>
        <div id="productsList"></div>
    </div>
</div>

<script>
function utf8_to_b64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64_to_utf8(str) { return decodeURIComponent(escape(atob(str))); }

function showSection(s, e) {
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(s + 'Section').classList.add('active');
    e.target.classList.add('active');
}

function getAuth() { 
    return { 
        user: document.getElementById('ghUser').value.trim(), 
        repo: document.getElementById('ghRepo').value.trim(), 
        token: document.getElementById('ghToken').value.trim() 
    }; 
}

async function loadProducts() {
    const {user, repo, token} = getAuth();
    if (!user || !repo || !token) return alert("يرجى إدخال بيانات GitHub أولاً!");
    
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        if(!res.ok) throw new Error();
        const data = await res.json();
        const products = JSON.parse(b64_to_utf8(data.content));
        const list = document.getElementById('productsList');
        list.innerHTML = '';
        
        if(products.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#999;">لا توجد منتجات.</p>';
            return;
        }
        
        const categories = { cats: [], dogs: [], chick: [], vaccine: [] };
        const catNames = { cats: 'قطط', dogs: 'كلاب', chick: 'كتاكيت', vaccine: 'تطعيمات' };

        products.forEach(p => {
            const cat = p.category || 'cats';
            if (categories[cat]) { categories[cat].push(p); } else { categories['cats'].push(p); }
        });

        for (const key in categories) {
            if (categories[key].length === 0) continue;
            
            let blockHtml = `<div class="category-block"><div class="category-title">${catNames[key]}</div>`;
            categories[key].forEach(p => {
                blockHtml += `
                    <div class="prod-item" id="p-${p.id}">
                        <div class="form-group"><label>الاسم:</label><input type="text" id="n-${p.id}" value="${p.name || ''}"></div>
                        <div class="form-group"><label>السعر:</label><input type="text" id="pr-${p.id}" value="${p.price || ''}"></div>
                        <div class="actions">
                            <button class="btn-edit" onclick="saveEdit(${p.id})">حفظ التعديل</button>
                            <button class="btn-del" onclick="deleteProduct(${p.id})">حذف ❌</button>
                        </div>
                    </div>`;
            });
            blockHtml += `</div>`;
            list.innerHTML += blockHtml;
        }
    } catch(err) {
        alert("فشل تحميل المنتجات. تأكد من البيانات!");
    }
}

async function saveEdit(id) {
    const {user, repo, token} = getAuth();
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content));
        
        const newName = document.getElementById(`n-${id}`).value;
        const newPrice = document.getElementById(`pr-${id}`).value;
        const prod = products.find(p => p.id === id);
        if(prod) {
            prod.name = newName;
            prod.price = newPrice;
        }
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Edit product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert("تم التعديل بنجاح!");
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء التعديل!");
    }
}

async function deleteProduct(id) {
    if (!confirm("هل أنت متأكد من حذف هذا المنتج؟")) return;
    const {user, repo, token} = getAuth();
    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content)).filter(p => p.id !== id);
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Delete product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert("تم الحذف!");
        loadProducts();
    } catch(err) {
        alert("خطأ أثناء الحذف!");
    }
}

async function addProduct() {
    const {user, repo, token} = getAuth();
    const name = document.getElementById('addName').value.trim();
    const category = document.getElementById('addCategory').value;
    const size = document.getElementById('addSize').value.trim();
    const storage = document.getElementById('addStorage').value.trim();
    const code = document.getElementById('addCode').value.trim();
    const price = document.getElementById('addPrice').value.trim();
    const image = document.getElementById('addImage').value.trim();

    if (!user || !repo || !token || !name || !price || !image) {
        return alert("يرجى ملء جميع الحقول المطلوبة!");
    }

    try {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, { headers: { "Authorization": `token ${token}` } });
        const data = await res.json();
        let products = JSON.parse(b64_to_utf8(data.content));
        
        const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
        products.push({ id: newId, name, category, size, storage, code, price, image });
        
        const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/products.json`, {
            method: "PUT",
            headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ message: "Add product", content: utf8_to_b64(JSON.stringify(products, null, 2)), sha: data.sha })
        });
        if(!response.ok) throw new Error();
        alert("تمت إضافة المنتج بنجاح!");
        
        document.getElementById('addName').value = '';
        document.getElementById('addSize').value = '';
        document.getElementById('addStorage').value = '';
        document.getElementById('addCode').value = '';
        document.getElementById('addPrice').value = '';
        document.getElementById('addImage').value = '';
    } catch(err) {
        alert("خطأ أثناء الإضافة!");
    }
}
</script>
</body>
                                                              </html>
